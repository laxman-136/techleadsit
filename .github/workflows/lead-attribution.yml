name: Lead attribution contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  attribution-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find conversation-bridge/includes landing-page-leads digital-marketing-integration -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: WordPress routing and CRM dry-run
        run: php run_test.php
      - name: Attribution through Bridge, Teams and TeleCRM
        run: php tests/lead-attribution-test.php
      - name: All 18 Bridge status options and offline TeleCRM mappings
        run: php landing-page-leads/tests/status-options-test.php
      - name: Bridge AJAX review permissions
        run: php landing-page-leads/tests/review-ajax-test.php
      - name: Bridge sync animation JavaScript syntax
        run: node --check landing-page-leads/sync-feedback.js
      - name: SCM question validation and verification
        run: php landing-page-leads/tests/scm-otp-test.php
      - name: Browser collection and form decoration contract
        run: node tests/lead-attribution-test.cjs
